<!doctype html>
<html lang="es">
  <head>
    <script>
      // Capture install prompt as early as possible so React can use it later.
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredPrompt = e;
      });
    </script>

    <meta name="theme-color" content="#1E4D8C" />

    <title>SafeSenior</title>
  </head>
